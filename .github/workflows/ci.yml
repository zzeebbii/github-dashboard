name: CI

# Every gate here has a local equivalent in `pnpm verify`. If CI can fail on
# something you cannot reproduce locally, that is a bug in this file.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run on an unchanged main. A template repository rots silently:
  # this catches dependency drift, base-image CVEs, and upstream breakage
  # while nobody is touching the code.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.22.0"

jobs:
  # ---------------------------------------------------------------------------
  # Fast, parallel static gates. fail-fast is OFF on purpose: an agent should
  # see EVERY problem in one run, not fix one and rediscover the next.
  # ---------------------------------------------------------------------------
  static:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: format, command: "pnpm run format:check" }
          - { name: lint, command: "pnpm run lint" }
          - { name: typecheck, command: "pnpm run typecheck" }
          - { name: architecture, command: "pnpm run arch:check" }
          - { name: dead-code, command: "pnpm run deps:check" }
          - { name: contract-drift, command: "pnpm run contract:check" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The contract and architecture checks need built declaration output.
      - name: Build TypeScript projects
        run: pnpm exec tsc --build
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  # ---------------------------------------------------------------------------
  # Tests. Unit and component are fast; integration needs Docker.
  # ---------------------------------------------------------------------------
  test-unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec tsc --build
      - run: pnpm run test:unit

  test-component:
    name: component tests (real browser)
    runs-on: ubuntu-latest
    # Browsers are preinstalled, so this never downloads them at job time.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec tsc --build
      - run: pnpm run test:component

  test-integration:
    name: integration tests (real PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec tsc --build
      # Testcontainers talks to the runner's Docker daemon directly.
      - run: pnpm run test:integration

  # ---------------------------------------------------------------------------
  # Proves the guardrails still BLOCK what they claim to block. Without this, a
  # check can silently stop working and keep reporting success — which happened
  # during this repository's construction (see ADR-0013).
  # ---------------------------------------------------------------------------
  guardrails:
    name: guardrails actually fire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec tsc --build
      - run: pnpm run verify:guardrails

  # ---------------------------------------------------------------------------
  # Contract change classification. Runs only on PRs, where a base ref exists.
  # ---------------------------------------------------------------------------
  contract-breaking:
    name: breaking change check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the base ref is available to diff against.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Classify contract changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: pnpm run contract:breaking

  # ---------------------------------------------------------------------------
  # Docker images, then E2E against the PRODUCTION-LIKE stack.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (prod-like stack)
    runs-on: ubuntu-latest
    needs: [static, test-unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The e2e suite imports @kit/contracts, which resolves to its built dist/.
      - run: pnpm exec tsc --build

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and start the production-like stack
        run: docker compose --profile prod-like up -d --build --wait

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then
              echo "Stack ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Stack did not become ready"; docker compose --profile prod-like logs; exit 1

      - name: Install Playwright browsers
        run: pnpm --filter @kit/e2e exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm run test:e2e

      - name: Dump container logs on failure
        if: failure()
        run: docker compose --profile prod-like logs --no-color

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose --profile prod-like down -v

  # ---------------------------------------------------------------------------
  # Security. Blocking, not advisory.
  # ---------------------------------------------------------------------------
  security:
    name: security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Build API image for scanning
        run: docker build -f apps/api/Dockerfile -t kit-api:scan .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kit-api:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # With SARIF output the action ignores `severity` unless this is set,
          # so exit-code would fail the build on LOW/MEDIUM findings too.
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif

  # ---------------------------------------------------------------------------
  # Publishable artifacts. Only from main.
  # ---------------------------------------------------------------------------
  publish:
    name: publish images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [static, guardrails, test-unit, test-component, test-integration, e2e, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload the published contract
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: artifacts/openapi.json
