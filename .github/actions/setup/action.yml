name: Setup
description: Node, pnpm, and a warm dependency cache. Used by every CI job so setup cannot drift between them.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        # Read from package.json's packageManager field, so the version is
        # pinned in exactly one place.
        run_install: false

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      # --frozen-lockfile fails if the lockfile is out of date with the
      # manifests, which is what makes CI builds reproducible.
      run: pnpm install --frozen-lockfile
