# Serves the SPA as static files. There is no backend: the browser talks to
# GitHub directly (ADR-0014).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (CSP etc.) come from security-headers.conf.template and are
    # included in EVERY location below: nginx drops inherited add_header lines in
    # any block that sets its own, so they cannot live at server level.

    # Hashed asset filenames are immutable, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html must never be cached, or users are pinned to a stale bundle
    # that references deleted asset hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
