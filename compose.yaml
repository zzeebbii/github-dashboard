# One compose file, two profiles. A single file (rather than a stack of
# overrides) means an agent can read the whole local topology in one place.
#
#   docker compose --profile dev up          → hot-reload development
#   docker compose --profile prod-like up    → production image, what CI/E2E use
#
# There is no backend: the SPA talks to GitHub directly from the browser.

name: agentic-kit

services:
  # ---------------------------------------------------------------------------
  # dev profile — source mounted, hot reload
  # ---------------------------------------------------------------------------
  web-dev:
    profiles: [dev]
    image: node:24-bookworm-slim
    working_dir: /repo
    command: >
      sh -c "corepack enable && corepack prepare pnpm@11.22.0 --activate &&
             pnpm install --frozen-lockfile &&
             pnpm --filter @kit/web run dev --host"
    environment:
      # Keep pnpm's store off the bind mount: otherwise pnpm creates a large
      # .pnpm-store inside your checkout, because it keeps the store on the same
      # filesystem as node_modules.
      PNPM_STORE_DIR: /pnpm-store
    ports:
      - "5173:5173"
    volumes:
      - .:/repo
      # Anonymous volumes keep container-built node_modules from being shadowed
      # by the host's (which may have different platform binaries).
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - pnpm-store:/pnpm-store

  # ---------------------------------------------------------------------------
  # prod-like profile — the image that ships. E2E runs against THIS.
  # ---------------------------------------------------------------------------
  web:
    profiles: [prod-like]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"

volumes:
  # Shared pnpm store for the dev container. A named volume (not a bind mount)
  # keeps the cache warm across restarts without polluting the checkout.
  pnpm-store:
